name: Go and terminal checks
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/lazymermaid ./cmd/lazymermaid
      - run: python3 scripts/pty_smoke.py --binary ./bin/lazymermaid

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publisher and independent source/module boundary tests
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'
      - run: python3 -m unittest discover -s scripts -p test_distribution.py
      - run: python3 scripts/check-distribution.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,announce
      - name: Verify complete snapshot archives and native executable
        run: python3 scripts/release.py check --project lazymermaid --binary lazymermaid --smoke
